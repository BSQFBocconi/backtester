[project]
name = "bsqf-backtester"
version = "0.1.0"
description = "Official event-driven backtesting engine of BSQF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsqf_backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
